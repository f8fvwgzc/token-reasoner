[workspace]
resolver = "2"
members = [
    "crates/lge-core",
    "crates/lge-index",
    "crates/lge-resolve",
    "crates/lge-store",
    "crates/lge-retrieve",
    "crates/lge-memory",
    "crates/lge-router",
    "crates/lge-usage",
    "crates/lge-filter",
    "crates/lge-session",
    "crates/lge-mcp",
    "crates/lge-proxy",
    "crates/lge-bench",
    "crates/lge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
lbug = "=0.22.3"
