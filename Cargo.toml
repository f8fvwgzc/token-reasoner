[workspace]
resolver = "2"
members = ["crates/lge-core", "crates/lge-index", "crates/lge-store", "crates/lge-router", "crates/lge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
lbug = "=0.22.3"
