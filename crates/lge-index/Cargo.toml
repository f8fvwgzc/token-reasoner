[package]
name = "lge-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
# Local repositories only: no openssl, https or ssh. The bundled libgit2 is
# compiled with `cc` (no cmake) and linked statically, whatever the system has.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4.34"
lge-core = { path = "../lge-core" }
rayon = "1.12.0"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-clojure-orchard = "0.2.9"
tree-sitter-cpp = "0.23.4"
tree-sitter-cuda = "0.21.2"
tree-sitter-dart = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.21.0"
tree-sitter-fsharp = "0.3.12"
tree-sitter-gleam = "1.0.0"
tree-sitter-go = "0.25.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-php = "0.25.1"
tree-sitter-powershell = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.13"
tree-sitter-solidity = "1.2.13"
tree-sitter-swift = "0.7.4"
tree-sitter-tags = "0.27.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
# The tree-sitter-perl organisation's crate; `tree-sitter-perl` itself pins an
# older tree-sitter.
ts-parser-perl = "2.0.6"

[dev-dependencies]
lge-resolve = { path = "../lge-resolve" }
tempfile = "3.27.0"
